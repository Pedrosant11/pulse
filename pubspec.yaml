name: pulse
description: "Pulse — match para festas e festivais de música eletrônica (modos Date e Crew)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.4
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_marker_cluster: ^8.2.2
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  image_cropper: ^12.2.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  markdown: ^7.3.1
  material_ui: ^1.5.0
  path_provider: ^2.1.6
  rive: ^0.14.11
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  vector_map_tiles: 9.0.0-beta.8
dev_dependencies:
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/legal/
    - assets/images/
    - assets/rive/

  # Fragment shaders (SPEC 12). Each file must be listed.
  shaders:
    - shaders/neon_background.frag
    - shaders/match_burst.frag
    - shaders/glitch.frag

  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Regular.ttf
        - asset: assets/fonts/Unbounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
        - asset: assets/fonts/Unbounded-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Launcher icon and native splash from the Pulse mark (assets/brand/, made by
# `flutter test tool/brand/render_brand_test.dart`). Regenerate with
# `dart run flutter_launcher_icons` and `dart run flutter_native_splash:create`.
# #0A0A0F is the theme background (PulseColors.background).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A0A0F"
  image: assets/brand/splash.png
  android_12:
    color: "#0A0A0F"
    image: assets/brand/splash.png
