# Publishes the public site (site/, generated by tool/build_site.dart) and
# the admin web console (lib/main_admin.dart, built here into site/admin)
# to GitHub Pages. Enable it once in the repository: Settings → Pages →
# Source: "GitHub Actions".
#
# The console needs two repository variables (Settings → Secrets and
# variables → Actions → Variables): SUPABASE_URL and
# SUPABASE_PUBLISHABLE_KEY (both public, the same as in the app). Without
# them the site is published without the console.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - lib/**
      - web/**
      - pubspec.*
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages

      - name: Set up Flutter
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_PUBLISHABLE_KEY != '' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Build the admin console
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_PUBLISHABLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          flutter pub get
          flutter build web --release -t lib/main_admin.dart \
            --base-href "${BASE_PATH}/admin/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            -o site/admin

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
